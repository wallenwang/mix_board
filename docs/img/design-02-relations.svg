<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 326" width="100%">
<style>
.t{font-family:system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif;font-size:13px;fill:#1b212b}
.s{font-family:system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif;font-size:12px;fill:#6b7280}
.h{font-family:system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif;font-size:13px;fill:#1b212b;font-weight:600}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text class="s" x="40" y="26">白板上只承认四种关系，每种一条固定线型</text>

<rect x="40" y="60" width="100" height="34" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="1"/>
<text class="t" x="90" y="77" text-anchor="middle" dominant-baseline="central">资料 D1</text>
<rect x="40" y="114" width="100" height="34" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="1"/>
<text class="t" x="90" y="131" text-anchor="middle" dominant-baseline="central">资料 D2</text>

<rect x="190" y="54" width="110" height="56" rx="8" fill="#faeeda" stroke="#854f0b" stroke-width="1"/>
<text class="h" x="245" y="82" text-anchor="middle" dominant-baseline="central">任务 A</text>
<rect x="190" y="154" width="110" height="44" rx="8" fill="#faeeda" stroke="#854f0b" stroke-width="1"/>
<text class="t" x="245" y="176" text-anchor="middle" dominant-baseline="central">子任务 A1</text>
<rect x="380" y="54" width="110" height="56" rx="8" fill="#faeeda" stroke="#854f0b" stroke-width="1"/>
<text class="h" x="435" y="82" text-anchor="middle" dominant-baseline="central">任务 B</text>

<rect x="540" y="54" width="100" height="56" rx="8" fill="#f7f5f0" stroke="#b4b2a9" stroke-width="1"/>
<text class="t" x="590" y="82" text-anchor="middle" dominant-baseline="central">文档 X</text>

<path d="M140,77 L186,77" fill="none" stroke="#b4b2a9" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#a)"/>
<path d="M140,131 C166,131 166,94 186,89" fill="none" stroke="#b4b2a9" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#a)"/>
<path d="M245,112 L245,150" fill="none" stroke="#b4b2a9" stroke-width="1"/>
<path d="M302,82 L376,82" fill="none" stroke="#0f6e56" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M492,82 L536,82" fill="none" stroke="#888780" stroke-width="1.2" stroke-dasharray="1 4" stroke-linecap="round" marker-end="url(#a)"/>

<text class="s" x="146" y="70">依据</text>
<text class="s" x="256" y="132">分解</text>
<text class="s" x="310" y="70">前置</text>
<text class="s" x="498" y="70">产出</text>

<path d="M40,250 L70,250" fill="none" stroke="#b4b2a9" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#a)"/>
<text class="s" x="78" y="250" dominant-baseline="central">依据：资料支撑任务</text>
<path d="M350,250 L380,250" fill="none" stroke="#b4b2a9" stroke-width="1"/>
<text class="s" x="388" y="250" dominant-baseline="central">分解：父拆成子</text>
<path d="M40,282 L70,282" fill="none" stroke="#0f6e56" stroke-width="1.6" marker-end="url(#a)"/>
<text class="s" x="78" y="282" dominant-baseline="central">前置：顺序依赖，会传染延误</text>
<path d="M350,282 L380,282" fill="none" stroke="#888780" stroke-width="1.2" stroke-dasharray="1 4" stroke-linecap="round" marker-end="url(#a)"/>
<text class="s" x="388" y="282" dominant-baseline="central">产出：任务交出的成果</text>
<text class="s" x="40" y="312">互斥 / 版本 / 候选：不用线，用分组框</text>
</svg>
