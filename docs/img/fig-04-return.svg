<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 246" width="100%">
<style>
.t{font-family:system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif;font-size:12px;fill:#1b212b}
.s{font-family:system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif;font-size:11px;fill:#6b7280}
.g{font-family:system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif;font-size:13px;fill:#0f6e56;font-weight:600}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text class="g" x="40" y="30">产出存为文档，挂在任务下面</text>

<rect x="40" y="60" width="100" height="44" rx="7" fill="#faeeda" stroke="#854f0b" stroke-width="1"/>
<text class="t" x="90" y="82" text-anchor="middle" dominant-baseline="central">T1 定调</text>

<rect x="180" y="60" width="100" height="44" rx="7" fill="#faeeda" stroke="#854f0b" stroke-width="1.6"/>
<text class="t" x="230" y="82" text-anchor="middle" dominant-baseline="central">T2 配色</text>

<path d="M144,82 L176,82" fill="none" stroke="#0f6e56" stroke-width="1.8" marker-end="url(#a)"/>

<rect x="170" y="168" width="140" height="52" rx="7" fill="#e8e4d9" stroke="#6b7280" stroke-width="1"/>
<text class="t" x="240" y="188" text-anchor="middle" dominant-baseline="central">配色方案 v1</text>
<text class="s" x="240" y="206" text-anchor="middle" dominant-baseline="central">三套色 + 适用场景</text>

<path d="M230,108 L230,164" fill="none" stroke="#888780" stroke-width="1.2" stroke-dasharray="1 4" stroke-linecap="round" marker-end="url(#a)"/>
<text class="s" x="240" y="136" dominant-baseline="central">产出</text>

<text class="s" x="340" y="76" dominant-baseline="central">AI 生成的初稿，修改两处后定稿</text>
<text class="s" x="340" y="184" dominant-baseline="central">文档挂在 T2 下面，聊天记录可以关闭</text>
<text class="s" x="340" y="202" dominant-baseline="central">制作 T3 版式时，可以直接读取这里确定的色值</text>
<text class="s" x="340" y="226" dominant-baseline="central">下次生成时不必重复交代背景</text>
</svg>
